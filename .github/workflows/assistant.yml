name: Independent assistant
on:
  pull_request:
    paths:
      - 'services/assistant/**'
      - '.github/workflows/assistant.yml'
  push:
    branches: ['codex/pc-*', develop, main]
    paths:
      - 'services/assistant/**'
      - '.github/workflows/assistant.yml'
permissions:
  contents: read
jobs:
  read-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: for file in services/assistant/*.mjs; do node --check "$file" || exit 1; done
      - run: node --test services/assistant/*.test.mjs
