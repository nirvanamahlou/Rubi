name: Nora CI

on:
  push:
    branches:
      - main
      - develop
      - PC-D-Integration
      - 'codex/pc-*'
  pull_request:
    branches:
      - main
      - develop
      - PC-D-Integration
      - 'codex/pc-*'
  workflow_dispatch:

# A new commit cancels only the older run for the same event and head branch.
# Push and pull-request checks remain independent, and all computer task branches
# never cancel or serialize each other's validation.
concurrency:
  group: nora-ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://nora_ci:nora_ci@127.0.0.1:5432/nora_ci?schema=public
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the repository pnpm version
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install the repository Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          test "$(pnpm --version)" = "11.19.0"

      - name: Verify multi-computer CI policy
        run: node --test .github/tests/ci-policy.test.mjs

      - name: Verify bounded PBX recording uploader
        run: node --test scripts/call-center/upload-issabel-recording.test.mjs

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma client
        run: |
          pnpm db:format
          git diff --exit-code -- packages/database/prisma/schema.prisma
          pnpm db:validate
          pnpm db:generate

      - name: Check formatting of changed files
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            if git show-ref --verify --quiet refs/remotes/origin/develop; then
              base_sha="$(git merge-base HEAD origin/develop)"
            else
              base_sha="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$base_sha" "$GITHUB_SHA" -- \
              '*.cjs' '*.css' '*.html' '*.js' '*.json' '*.jsx' '*.md' '*.mjs' \
              '*.mts' '*.scss' '*.ts' '*.tsx' '*.yaml' '*.yml'
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed Prettier-supported files."
          else
            pnpm exec prettier --check "${changed_files[@]}"
          fi

      - name: Full monorepo lint
        run: pnpm lint

      - name: Full monorepo typecheck
        run: pnpm typecheck

  tests:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the repository pnpm version
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install the repository Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Run all repository tests
        env:
          DATABASE_URL: postgresql://nora_ci:nora_ci@127.0.0.1:5432/nora_ci?schema=public
        run: pnpm test

  database:
    name: PostgreSQL 18 migration and seed gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: nora_ci
          POSTGRES_USER: nora_ci
          POSTGRES_PASSWORD: nora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nora_ci -d nora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://nora_ci:nora_ci@127.0.0.1:5432/nora_ci?schema=public
      CUSTOMER_CONTACT_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CUSTOMER_CONTACT_FINGERPRINT_KEY_BASE64: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
      CUSTOMER_CONTACT_ENCRYPTION_KEY_VERSION: '1'
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the repository pnpm version
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install the repository Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma client
        run: |
          pnpm db:validate
          pnpm db:generate

      - name: Apply every migration to an empty PostgreSQL 18 database
        run: pnpm --filter @nora/database exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Confirm migration status
        run: pnpm --filter @nora/database exec prisma migrate status --schema prisma/schema.prisma

      - name: Prove seed repeatability
        run: |
          pnpm --filter @nora/database db:seed
          pnpm --filter @nora/database db:seed

      - name: Prove IAM user unit and company branch data upgrades
        env:
          IAM_USER_UNIT_TEST: '1'
        run: pnpm --filter @nora/database exec vitest run test/iam-user-unit-postgres.spec.ts test/five-company-branches-postgres.spec.ts

      - name: Prove immutable purchase FX snapshots
        env:
          PURCHASE_FX_TEST: '1'
        run: pnpm --filter @nora/database exec vitest run test/purchase-fx-postgres.spec.ts

      - name: Prove passenger insurance issuance and reference invariants
        env:
          INSURANCE_POLICY_TEST: '1'
        run: pnpm --filter @nora/database exec vitest run test/insurance-policy-postgres.spec.ts

      - name: Prove hotel rate broker compatibility and foreign keys
        env:
          HOTEL_RATE_BROKER_TEST: '1'
        run: pnpm --filter @nora/database exec vitest run test/hotel-rate-broker-postgres.spec.ts

      - name: Prove Marketing CAS, replay and rollback atomicity
        env:
          NORA_RUN_MARKETING_POSTGRES_TESTS: '1'
        run: |
          pnpm --filter @nora/contracts build
          pnpm --filter @nora/database build
          pnpm --filter @nora/api exec vitest run src/marketing/marketing-records.postgres.spec.ts

      - name: Prove financial source, refund and petty-cash atomicity
        env:
          NORA_RUN_FINANCIAL_EVENT_POSTGRES_TESTS: '1'
        run: pnpm --filter @nora/api exec vitest run test/financial-events.postgres.spec.ts test/accounting-workflows.postgres.spec.ts --maxWorkers=1

      - name: Prove rollback-safe consecutive Sales contract numbers
        # The prior financial-source step has built the shared packages.
        env:
          NORA_RUN_SALES_NUMBER_POSTGRES_TESTS: '1'
        run: pnpm --filter @nora/api exec vitest run test/sales-contract-number.postgres.spec.ts --maxWorkers=1

      - name: Prove recurring flight purchase and payment atomicity
        env:
          NORA_RUN_FINANCE_POSTGRES_TESTS: '1'
        run: pnpm --filter @nora/api exec vitest run src/finance/ticket-cost/finance-ticket-payment.postgres.spec.ts --maxWorkers=1

      - name: Prove shared flight capacity across commercial destinations
        env:
          NORA_RUN_TICKET_ROUTES_POSTGRES_TESTS: '1'
        run: pnpm --filter @nora/api exec vitest run src/ticket-catalog/ticket-sale-routes.postgres.spec.ts --maxWorkers=1

      - name: Prove company bank account encryption, CAS and audit atomicity
        env:
          NORA_RUN_BANK_ACCOUNT_POSTGRES_TESTS: '1'
        run: pnpm --filter @nora/api exec vitest run test/bank-accounts.postgres.spec.ts --maxWorkers=1

      - name: Prove assistant read-only PostgreSQL and HTTP boundaries
        env:
          NORA_RUN_ASSISTANT_POSTGRES_TESTS: '1'
        run: |
          pnpm --filter @nora/config build
          pnpm --filter @nora/api exec vitest run src/assistant-read/assistant-read.postgres.spec.ts

      - name: Prove partner360 role isolation and manual USD rate persistence
        env:
          NORA_RUN_B2B_POSTGRES_TESTS: '1'
        run: |
          docker pull postgres:18.1-alpine
          pnpm --filter @nora/api exec vitest run src/b2b/b2b.postgres.spec.ts --maxWorkers=1

      - name: Prove durable Call Center history, replay and branch isolation
        env:
          NORA_RUN_CALL_CENTER_POSTGRES_TESTS: '1'
        run: pnpm --filter @nora/api exec vitest run src/customer-affairs/call-center.spec.ts src/customer-affairs/call-center-workflow.spec.ts src/customer-affairs/call-center-access.postgres.spec.ts src/customer-affairs/call-center-answered-access.postgres.spec.ts src/customer-affairs/call-center-read.spec.ts src/integrations/telephony.spec.ts src/integrations/issabel/issabel.postgres.spec.ts --maxWorkers=1

  build:
    name: Full production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the repository pnpm version
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install the repository Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Build all applications and buildable packages
        env:
          DATABASE_URL: postgresql://nora_ci:nora_ci@127.0.0.1:5432/nora_ci?schema=public
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
        run: pnpm build
