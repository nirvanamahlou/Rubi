name: Rubi CI

on:
  push:
    branches:
      - main
      - develop
      - 'codex/pc-a-*'
      - 'codex/pc-b-*'
  pull_request:
    branches:
      - main
      - develop
      - 'codex/pc-a-*'
      - 'codex/pc-b-*'
  workflow_dispatch:

# A new commit cancels only the older run for the same head branch. PC-A and PC-B
# branches therefore never cancel or serialize each other's validation.
concurrency:
  group: rubi-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the repository pnpm version
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install the repository Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          test "$(pnpm --version)" = "11.19.0"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma client
        env:
          DATABASE_URL: postgresql://rubi_ci:rubi_ci@127.0.0.1:5432/rubi_ci?schema=public
        run: |
          pnpm db:format
          git diff --exit-code -- packages/database/prisma/schema.prisma
          pnpm db:validate
          pnpm db:generate

      - name: Check formatting of changed files
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            if git show-ref --verify --quiet refs/remotes/origin/develop; then
              base_sha="$(git merge-base HEAD origin/develop)"
            else
              base_sha="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$base_sha" "$GITHUB_SHA" -- \
              '*.cjs' '*.css' '*.html' '*.js' '*.json' '*.jsx' '*.md' '*.mjs' \
              '*.mts' '*.scss' '*.ts' '*.tsx' '*.yaml' '*.yml'
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed Prettier-supported files."
          else
            pnpm exec prettier --check "${changed_files[@]}"
          fi

      - name: Full monorepo lint
        run: pnpm lint

      - name: Full monorepo typecheck
        run: pnpm typecheck

  tests:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the repository pnpm version
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install the repository Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Run all repository tests
        env:
          DATABASE_URL: postgresql://rubi_ci:rubi_ci@127.0.0.1:5432/rubi_ci?schema=public
        run: pnpm test

  database:
    name: PostgreSQL 18 migration and seed gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: rubi_ci
          POSTGRES_USER: rubi_ci
          POSTGRES_PASSWORD: rubi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rubi_ci -d rubi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://rubi_ci:rubi_ci@127.0.0.1:5432/rubi_ci?schema=public
      CUSTOMER_CONTACT_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CUSTOMER_CONTACT_FINGERPRINT_KEY_BASE64: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
      CUSTOMER_CONTACT_ENCRYPTION_KEY_VERSION: '1'
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the repository pnpm version
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install the repository Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma client
        run: |
          pnpm db:validate
          pnpm db:generate

      - name: Apply every migration to an empty PostgreSQL 18 database
        run: pnpm --filter @rubi/database exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Confirm migration status
        run: pnpm --filter @rubi/database exec prisma migrate status --schema prisma/schema.prisma

      - name: Prove seed repeatability
        run: |
          pnpm --filter @rubi/database db:seed
          pnpm --filter @rubi/database db:seed

  build:
    name: Full production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the repository pnpm version
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install the repository Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Build all applications and buildable packages
        env:
          DATABASE_URL: postgresql://rubi_ci:rubi_ci@127.0.0.1:5432/rubi_ci?schema=public
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
        run: pnpm build
