name: Personal site identity protocol
on:
  push:
    branches: ['codex/pc-d-niyayesh-*', PC-D-Integration]
    paths:
      [
        'apps/identity-gateway/**',
        pnpm-lock.yaml,
        '.github/workflows/identity-protocol.yml',
      ]
  pull_request:
    paths:
      [
        'apps/identity-gateway/**',
        pnpm-lock.yaml,
        '.github/workflows/identity-protocol.yml',
      ]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.4.0-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NORA_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @nora/identity-gateway
      - run: pnpm --filter @nora/identity-gateway build
      - run: pnpm --filter @nora/identity-gateway test
