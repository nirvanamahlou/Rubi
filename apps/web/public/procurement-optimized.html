suppliers:{title:'تأمین‌کنندگان و استعلام',icon:'building',members:['suppliers','quotes','contracts'],description:'از انتخاب تأمین‌کننده تا مقایسه پیشنهاد و قرارداد تأمین'},
orders:{title:'سفارش و تحویل',icon:'box',members:['orders','receipts','travel'],description:'پیگیری تعهد، دریافت، مغایرت و مرجع خرید سفر'},
invoices:{title:'فاکتور و مالی',icon:'file',members:['invoices'],description:'تطبیق تجاری و مشاهده پاسخ مالی؛ مستقل از وضعیت تحویل'}
};
const subLabels={requests:'همه درخواست‌ها',approvals:'منتظر تصمیم من',suppliers:'پروفایل تأمین‌کنندگان',quotes:'استعلام و مقایسه',contracts:'قراردادها · فاز دوم',orders:'سفارش‌ها',receipts:'دریافت، مغایرت و مرجوعی',travel:'ارجاع خدمات سفر',invoices:'فاکتورها و تطبیق',settings:'سیاست‌ها و تنظیمات'};
function groupOf(v){return Object.keys(groups).find(k=>groups[k].members.includes(v))||'home'}
function home(){
 const rs=scope(requests),os=scope(orders),ivs=scope(invoices);
 const awaiting=rs.filter(r=>['ارسال‌شده','در بررسی'].includes(r.status));
 const pending=rs.filter(r=>!['لغوشده','ردشده','بسته'].includes(r.status));
 const metrics=[['منتظر تصمیم',awaiting.length,'approvals','check'],['سفارش باز',os.filter(o=>o.status==='صادرشده').length,'orders','cart'],['نیازمند تطبیق',ivs.filter(i=>!match(i).ok).length,'invoices','alert']];
 const cards=[
 ['requests','#eaf2ff','var(--blue)','ثبت نیاز و تأیید آن بدون جابه‌جایی بین منوها','درخواست‌ها • تأییدهای من',rs.length+' پرونده'],
 ['suppliers','#f2eaff','var(--purple)','پروفایل تجاری، مقایسه پیشنهاد و انتخاب مستدل','تأمین‌کننده • استعلام • قرارداد',suppliers.length+' تأمین‌کننده مرجع'],
 ['orders','#e4f7f1','var(--green)','سفارش نسخه‌دار تا دریافت و تعیین تکلیف مغایرت','سفارش • دریافت و مرجوعی • خدمات سفر',os.length+' سفارش'],
 ['invoices','#fff2df','var(--amber)','تطبیق سفارش و دریافت با فاکتور و پاسخ مالی','فاکتور • تطبیق • وضعیت پرداخت',ivs.length+' فاکتور']
 ];
 return '<div class="metrics compact-metrics">'+metrics.map(([l,n,v,ic])=>'<button class="metric" data-act="'+action(()=>navigate(v))+'"><div class="inline">'+icon(ic)+l+'</div><b>'+fa(n)+'</b><small>مشاهده موارد مرتبط ←</small></button>').join('')+'</div>'+
 '<div class="consolidated-hubs">'+cards.map(([k,tint,color,desc,subs,count])=>'<button class="hub" style="--tint:'+tint+';--accent:'+color+'" data-act="'+action(()=>navigate(k))+'"><div class="hub-head"><span class="colored-icon">'+icon(groups[k].icon)+'</span><div><h3>'+groups[k].title+'</h3><small>'+subs+'</small></div></div><p>'+desc+'</p><div class="hub-foot"><span>'+fa(count)+'</span><strong>ورود به بخش ←</strong></div></button>').join('')+'</div>'+
 panel('پیگیری‌های من',table(['پرونده / نیاز','مرحله','اقدام بعدی','مسئول / موعد',''],pending.map(r=>'<tr><td>'+esc(r.title)+'<p class="muted">'+r.id+'</p></td><td>'+badge(r.status,statusColor(r.status))+'</td><td>'+esc(r.next)+'</td><td>'+esc(r.owner)+'<p class="muted">'+fa(r.due)+'</p></td><td>'+btn('بازکردن پرونده',()=>detail('request',r.id),'small')+'</td></tr>')),btn('همه درخواست‌ها',()=>navigate('requests'),'small'),'clock');
}
const legacyDetail=detail;detail=function(kind,id){state.view=kind==='request'?'requests':kind==='order'?'orders':'invoices';legacyDetail(kind,id)};
const legacyRender=render;
render=function(){
 legacyRender();
 const key=groupOf(state.view),group=groups[key];
 document.getElementById('side').innerHTML=Object.entries(groups).map(([k,g])=>btn(g.title,()=>navigate(k),'side-link '+(k===key?'active':''),g.icon)).join('');
 const tabs=document.getElementById('tabs');
 tabs.innerHTML='<label class="mobile-group">بخش اصلی<select id="groupSelect" aria-label="انتخاب بخش اصلی">'+Object.entries(groups).map(([k,g])=>'<option value="'+k+'" '+(key===k?'selected':'')+'>'+g.title+'</option>').join('')+'</select></label>'+
 (key==='home'?'':group.members.map(v=>btn(subLabels[v]||views[v][0],()=>navigate(v),'tab '+(state.view===v?'active':''),views[v][2])).join(''));
 tabs.classList.toggle('home-tabs',key==='home'||group.members.length===1);
 const sel=document.getElementById('groupSelect');sel.onchange=e=>navigate(e.target.value);
 if(!state.selected&&['suppliers','quotes'].includes(state.view)){const bar=document.querySelector('.filters');if(bar){bar.querySelectorAll('button,select').forEach(e=>e.remove());const hint=document.createElement('span');hint.className='muted';hint.textContent=state.view==='suppliers'?'جستجو در نام، شناسه و مشخصات تأمین‌کننده':'جستجو در شناسه پیشنهاد، درخواست یا تأمین‌کننده';bar.append(hint)}}
 document.getElementById('crumb').textContent=group.title+(state.view!==key?' / '+(subLabels[state.view]||views[state.view][0]):'');
 if(!state.selected){document.getElementById('title').textContent=group.title;document.getElementById('subtitle').textContent=group.description}
 document.title=group.title+' | روبی';
 document.querySelector('.page-foot').textContent='ماکاپ بهینه خرید و تأمین • ۶ بخش اصلی • داده ساختگی و ذخیره در نشست جاری • هیچ سفارش خارجی یا پرداخت واقعی ایجاد نمی‌شود.';
};

const baseField=field;field=(id,label,...args)=>baseField(id,label==='مبلغ برآورد'?'مبلغ':label,...args);
modal.onclick=event=>{if(event.target===modal)modal.close()};
filters=()=>`<div class="filters"><label class="filter-field search" for="query"><span>جست‌وجو</span><input id="query" aria-label="جست‌وجو" placeholder="شماره، عنوان، تأمین‌کننده…" value="${esc(state.q)}"></label><label class="filter-field" for="status"><span>وضعیت درخواست</span><select id="status" aria-label="وضعیت درخواست"><option>همه</option>${['پیش‌نویس','ارسال‌شده','در بررسی','نیازمند اصلاح','تأییدشده','در حال تأمین','صادرشده','ارسال‌نشده','پذیرفته در مالی'].map(s=>`<option ${state.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="filter-field" for="unit"><span>واحد درخواست‌کننده</span><select id="unit" aria-label="واحد درخواست‌کننده"><option>همه</option>${units.map(s=>`<option ${state.unit===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="date-filter"><span>از تاریخ</span>${btn(state.fromSelected?fa(state.from):'انتخاب تاریخ',()=>datePicker(state.from,v=>{if(v>state.to)return toast('تاریخ شروع باید قبل از پایان باشد.');state.from=v;state.fromSelected=true;render()}),'small','calendar')}</label><label class="date-filter"><span>تا تاریخ</span>${btn(state.toSelected?fa(state.to):'انتخاب تاریخ',()=>datePicker(state.to,v=>{if(v<state.from)return toast('تاریخ پایان باید بعد از شروع باشد.');state.to=v;state.toSelected=true;render()}),'small','calendar')}</label>${btn('پاک‌کردن',()=>{Object.assign(state,{q:'',status:'همه',unit:'همه',from:'1405/06/01',to:'1405/06/31',fromSelected:false,toSelected:false,page:1});render()},'small')}</div>`;

document.getElementById('brandIcon').innerHTML=icon('send');document.getElementById('bell').innerHTML=icon('bell');document.getElementById('bell').onclick=()=>open('اعلان‌های خرید',`<div class="timeline-item">تکمیل نرخ مبنای تأیید اشتراک ارزی</div><div class="timeline-item">پذیرش خدمت تعمیر تهویه پیش از ارجاع فاکتور</div>`);document.getElementById('branch').onchange=e=>{state.branch=e.target.value;state.selected=null;render()};if(views[location.hash.slice(1)])state.view=location.hash.slice(1);render();
</script></body></html>
