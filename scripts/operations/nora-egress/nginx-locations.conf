# Insert inside the existing avinaofficial.ir TLS server; do not replace its other routes.
# Public Origin is checked BEFORE normalization to Next's --hostname 0.0.0.0 --port 3000.
# Re-evaluate the normalized origin if Next's listen address/port changes.
location = /api/assistant/v3/conversation {
    if ($http_origin != "https://avinaofficial.ir") { return 403; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Origin https://0.0.0.0:3000;
    proxy_read_timeout 70s;
}
location = /v3/assistant/conversation {
    if ($http_origin != "") { return 403; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:4300;
    proxy_set_header Host $host;
    proxy_read_timeout 65s;
}
location = /api/assistant/v2/conversation {
    if ($http_origin != "https://avinaofficial.ir") { return 403; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Origin https://0.0.0.0:3000;
    proxy_read_timeout 15s;
}
location ^~ /v2/assistant/ {
    # Only the server-side BFF calls this route; browser messages use the route above.
    if ($http_origin != "") { return 403; }
    proxy_pass http://127.0.0.1:4300;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}
location ^~ /v1/assistant/ {
    proxy_pass http://127.0.0.1:4300;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}
location = /v1/executive/snapshot {
    proxy_pass http://127.0.0.1:4300;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}
